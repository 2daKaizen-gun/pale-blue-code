name: Refresh frontier pool

# Keep the TESS fresh-sky pool tracking the newest sector (Phase 10 sub-10-4).
# TESS releases a new sector ~every 27 days; this reruns the builder twice a month
# and commits only when the pool's *content* actually changed (a new sector or a
# different star set) — never for a build-timestamp-only diff.
on:
  schedule:
    - cron: '0 6 1,15 * *'   # 06:00 UTC on the 1st and 15th (~biweekly)
  workflow_dispatch: {}       # allow a manual run from the Actions tab

permissions:
  contents: write             # to commit + push the refreshed pool

concurrency:
  group: frontier-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The pinned backend stack (it includes astroquery, via lightkurve) rather than
      # a bare `pip install astroquery`: the test step below needs it, and the builder
      # then runs on the same stack CI tests.
      - name: Install builder + test deps
        run: pip install -r backend/requirements-dev.txt

      - name: Rebuild pool from the newest SPOC sector
        # --n 100: the hunt pool is the 100 smallest planet-size dwarfs (sub-11-17
        # widened it from 50). Without this the default n=50 would silently shrink
        # the pool back on the next refresh, dropping half the searched stars.
        #
        # MAST drops connections now and then (2026-09-01: RemoteDisconnected
        # failed the whole run, so the pool sat on the old sector for two
        # weeks). The builder is idempotent, so a transient failure is retried
        # with a pause; three strikes still fail the run loudly.
        run: |
          for attempt in 1 2 3; do
            python scripts/build_frontier_seeds_tess.py --n 100 && exit 0
            echo "::warning::builder attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Test the rebuilt pool before committing it
        # A push made with GITHUB_TOKEN does not trigger the CI workflow, so the
        # bot's commit (e.g. 6b7a53a, sector 107) used to land on main untested.
        # Run the backend suite against the freshly built pool here; a red suite
        # fails the run before the commit step, leaving main untouched.
        working-directory: backend
        run: python -m pytest -q

      - name: Commit only if the pool content changed
        run: |
          POOL=backend/data/frontier_seeds_tess.json
          # Compare meaningful content (sector + star ids) against HEAD, ignoring the
          # built_at timestamp, so a no-op rebuild leaves the tree clean.
          changed=$(python - "$POOL" <<'PY'
          import json, subprocess, sys
          path = sys.argv[1]
          new = json.load(open(path, encoding="utf-8"))
          try:
              old = json.loads(subprocess.check_output(["git", "show", f"HEAD:{path}"]))
          except Exception:
              old = {}
          key = lambda p: (p.get("latest_sector"), p.get("tics"))
          print("yes" if key(new) != key(old) else "no")
          PY
          )
          if [ "$changed" = "no" ]; then
            echo "Pool content unchanged — discarding timestamp-only diff."
            git checkout -- "$POOL"
            exit 0
          fi
          sector=$(python -c "import json;print(json.load(open('$POOL',encoding='utf-8'))['latest_sector'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$POOL"
          git commit -m "chore(frontier): refresh fresh-sky pool → sector ${sector}"
          git push
