name: CI

# Re-run on every push what WORKFLOW's Test step requires by hand: the backend
# suite, the frontend suite, and the production build. Added 2026-09-11 after
# sub-11-26 shipped a build break that vitest could not see.
#
# The two jobs run on different OSes on purpose:
#  - frontend on Windows: the break was a file-name casing collision
#    (earthSizeDossier.ts vs EarthSizeDossier.tsx). Linux is case-sensitive and
#    resolves the import correctly, so an ubuntu build would have passed — the
#    bug only exists on a case-insensitive filesystem, which is where we develop.
#  - backend on Ubuntu at Python 3.12, installing the *pinned* requirements —
#    the stack Railway actually deploys, not whatever is installed locally.
#
# eslint became a gate on 2026-09-26, once the 32 errors it reported at CI's
# birth were paid down to 0 (a gate that is red on day one teaches nobody
# anything — so the debt went first).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install pinned requirements
        run: pip install -r requirements-dev.txt

      - name: pytest
        # No backend/cache in CI (it is gitignored): the suite must stand on
        # tracked files alone. Verified on a clean worktree without a cache:
        # 244 passed on 2026-10-17 against the sector-107 pool.
        run: python -m pytest -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: build (tsc -b + vite build)
        run: npm run build

      - name: vitest
        run: npx vitest run
